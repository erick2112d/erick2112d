plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Подпись релиза берётся из переменных окружения (секреты GitHub) — в репозитории ключа нет.
def keystorePath = System.getenv('LL_KEYSTORE_PATH')
def hasReleaseKey = keystorePath != null && file(keystorePath).exists()

android {
    namespace 'ru.mayak.lastlight'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.mayak.lastlight'   // должно совпадать с названием пакета в консоли RuStore
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('LL_VERSION_CODE') ?: '1')
        versionName System.getenv('LL_VERSION_NAME') ?: '0.3.0'
        // ID приложения в консоли RuStore (цифры из адреса console.rustore.ru/apps/<ID>/...) — включает платежи
        resValue 'string', 'rustore_console_app_id', (System.getenv('RUSTORE_APP_ID') ?: '').trim()
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('LL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LL_KEY_ALIAS') ?: 'lastlight'
                keyPassword System.getenv('LL_KEY_PASSWORD') ?: System.getenv('LL_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'ru.rustore.sdk:pay:10.3.0'   // платежи RuStore (Pay SDK)
}

// Перед сборкой кладём в приложение свежую однофайловую версию игры (npm run single → dist/last-light.html).
tasks.register('copyGame', Copy) {
    from(rootProject.file('../dist/last-light.html')) { rename { 'index.html' } }
    into 'src/main/assets'
}
preBuild.dependsOn copyGame
