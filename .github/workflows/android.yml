# Сборка Android-приложения для RuStore: игра (однофайловая версия) внутри WebView.
# Без секретов собирается тестовый APK (debug). С секретами LL_KEYSTORE_BASE64 и LL_KEYSTORE_PASSWORD —
# подписанные релизные APK и AAB для загрузки в RuStore. Готовые файлы — во вкладке Actions → запуск → Artifacts.
name: Android (RuStore)

on:
  push:
    branches: [claude/gallant-einstein-riajwm, main, master]
    paths: ['src/**', 'style.css', 'index.html', 'scripts/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Версии SDK RuStore (диагностика)
        run: |
          for r in https://nexus-external.vkteam.ru/repository/maven-rustore-exposed https://artifactory-external.vkpartner.ru/artifactory/maven-rustore-exposed https://artifactory-external.vkpartner.ru/artifactory/maven; do
            echo "== $r"; curl -sS -m 20 "$r/ru/rustore/sdk/pay/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | tail -8 || true
            curl -sS -m 20 "$r/ru/rustore/sdk/bom/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | tail -3 || true
          done

      - name: Однофайловая версия игры
        run: node scripts/single.mjs

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.LL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет LL_KEYSTORE_BASE64 не задан — собирается только тестовый APK"
          fi

      - name: Сборка
        working-directory: android
        env:
          LL_KEYSTORE_PASSWORD: ${{ secrets.LL_KEYSTORE_PASSWORD }}
          LL_VERSION_CODE: ${{ github.run_number }}
          LL_VERSION_NAME: 0.3.${{ github.run_number }}
          # ID приложения в консоли RuStore: Settings → Secrets and variables → Actions → Variables
          RUSTORE_APP_ID: ${{ vars.RUSTORE_APP_ID }}
        run: |
          chmod +x gradlew
          if [ -n "$LL_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: last-light-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
